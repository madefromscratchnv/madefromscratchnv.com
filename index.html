<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Made From Scratch | Bakery &amp; Provisions</title>
  <meta name="description" content="Made From Scratch Bakery & Provisions in Fernley, Nevada. Handmade, small-batch baked goods and provisions from our roadside stand.">
  <meta property="og:title" content="Made From Scratch | Bakery & Provisions">
  <meta property="og:description" content="Handmade, small-batch baked goods and provisions from our roadside stand in Fernley, Nevada.">
  <meta property="og:image" content="/mfs-home.webp">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#663366">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4eddf;
    }
    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .site {
      position: relative;
      width: min(100%, 1200px);
      line-height: 0;
      background: #f4eddf;
    }
    .site img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 2;
      background: transparent;
      border-radius: 2px;
      cursor: pointer;
    }
    .hotspot:focus-visible {
      outline: 3px solid #663366;
      outline-offset: 3px;
    }
    .anchor {
      position: absolute;
      left: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    /* Navigation */
    .shop-nav       { left: 33.4%; top: 2.2%; width: 4.7%; height: 2.8%; }
    .about-nav      { left: 38.6%; top: 2.2%; width: 5.2%; height: 2.8%; }
    .stand-nav      { left: 44.0%; top: 2.2%; width: 7.5%; height: 2.8%; }
    .order-nav      { left: 78.8%; top: 1.9%; width: 13.4%; height: 3.4%; }

    /* Main calls to action */
    .hero-order     { left: 6.0%;  top: 18.2%; width: 24.5%; height: 2.8%; }
    .weekly-order   { left: 50.8%; top: 50.1%; width: 19.0%; height: 2.7%; }
    .provisions     { left: 5.9%;  top: 61.8%; width: 18.2%; height: 2.7%; }
    .about-stand    { left: 51.6%; top: 77.0%; width: 18.3%; height: 2.7%; }

    #stand { top: 66.0%; }

    @media (max-width: 640px) {
      .site { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="site" aria-label="Made From Scratch Bakery & Provisions">
    <img src="/mfs-home.webp" alt="Made From Scratch Bakery & Provisions homepage featuring Northern Nevada, baked goods, preserves, and the roadside stand.">

    <span id="stand" class="anchor" aria-hidden="true"></span>

    <a class="hotspot shop-nav" href="/order/" aria-label="Shop Made From Scratch"></a>
    <a class="hotspot about-nav" href="#stand" aria-label="About Made From Scratch"></a>
    <a class="hotspot stand-nav" href="#stand" aria-label="The Made From Scratch roadside stand"></a>
    <a class="hotspot order-nav" href="/order/" aria-label="Order ahead"></a>

    <a class="hotspot hero-order" href="/order/" aria-label="View today's selection"></a>
    <a class="hotspot weekly-order" href="/order/" aria-label="See what's baking"></a>
    <a class="hotspot provisions" href="/order/" aria-label="Shop provisions"></a>
    <a class="hotspot about-stand" href="#stand" aria-label="About the stand"></a>
  </main>
</body>
</html>
